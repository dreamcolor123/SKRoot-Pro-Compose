plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def requestedApplicationId = project.findProperty('PUBLISH_APPLICATION_ID')?.toString()?.trim()
def requestedAppName = project.findProperty('PUBLISH_APP_NAME')?.toString()?.trim()
def effectiveApplicationId = requestedApplicationId ?: 'com.linux.permissionmanager'
def effectiveAppName = requestedAppName ?: 'SKRoot(Pro)'
def releaseStoreFile = project.findProperty('RELEASE_STORE_FILE')?.toString()
def releaseStorePassword = project.findProperty('RELEASE_STORE_PASSWORD')?.toString()
def releaseKeyAlias = project.findProperty('RELEASE_KEY_ALIAS')?.toString()
def releaseKeyPassword = project.findProperty('RELEASE_KEY_PASSWORD')?.toString()
def hasPublishedSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

android {
    namespace 'com.linux.permissionmanager'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId effectiveApplicationId
        minSdk 26
        targetSdk 31
        versionCode 1
        versionName '4.5.3'
        buildConfigField 'String', 'PUBLISH_APP_NAME', "\"${effectiveAppName.replace('\\', '\\\\').replace('"', '\\"')}\""
        manifestPlaceholders = [appLabel: effectiveAppName]

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
                abiFilters 'arm64-v8a'
            }
        }
    }

    signingConfigs {
        if (hasPublishedSigning) {
            publishedRelease {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasPublishedSigning) signingConfig signingConfigs.publishedRelease
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.18.1'
        }
    }

    buildFeatures {
        aidl true
        compose true
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        // These two detectors crash under the fixed AGP 8.7.3 / Lifecycle 2.9.4 /
        // Compose 2025.08 toolchain before any project source is inspected.
        disable 'NullSafeMutableLiveData',
                'FrequentlyChangingValue',
                'RememberInComposition',
                'AutoboxingStateCreation',
                // targetSdk 31 is an explicit compatibility contract for this migration.
                'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.10.1'

    implementation platform('androidx.compose:compose-bom:2025.08.01')
    androidTestImplementation platform('androidx.compose:compose-bom:2025.08.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3:1.4.0'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.9.4'
    implementation 'androidx.navigation:navigation-compose:2.9.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'org.json:json:20240303'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
